name: Northstar
options:
  bundleIdPrefix: com.morrison
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: GT47DS9Z72
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "11"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: "1.6.1"
targets:
  Northstar:
    type: application
    platform: iOS
    sources:
      - path: Northstar
    settings:
      configs:
        Debug:
          NORTHSTAR_API_BASE_URL: "http:/$()/localhost:3001"
        Release:
          NORTHSTAR_API_BASE_URL: "https:/$()/www.northstartravelguide.com"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morrison.northstar
        PRODUCT_NAME: Northstar
        INFOPLIST_FILE: Northstar/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ""
        CLERK_PUBLISHABLE_KEY: "$(NORTHSTAR_CLERK_PUBLISHABLE_KEY)"
    configFiles:
      Debug: Config/Northstar.xcconfig
      Release: Config/Northstar.xcconfig
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
  NorthstarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NorthstarUITests
    dependencies:
      - target: Northstar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morrison.northstar.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Northstar
schemes:
  Northstar:
    build:
      targets:
        Northstar: all
        NorthstarUITests: [test]
    test:
      targets:
        - NorthstarUITests
      environmentVariables:
        E2E_EMAIL: e2e+clerk_test@northstartravelguide.com
